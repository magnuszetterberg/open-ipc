<!doctype html>
<meta charset="utf-8">
<title>Latency Clock</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 12vw/1 monospace; }
  small { display: block; font-size: 2.5vw; color: #888; text-align: center; margin-top: 2vw; }
</style>
<div><span id="t"></span><small>UTC · same clock as the TX overlay</small></div>
<script>
  const el = document.getElementById('t');
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  (function tick() {
    const d = new Date();
    el.textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}.${pad(d.getUTCMilliseconds(), 3)}`;
    requestAnimationFrame(tick);
  })();
</script>
