# Radar camera firmware for the FRDM-RW612. Board: frdm_rw612 (esp32/build.sh radar sets it).

# C++17 with the standard library: wifibroadcast.hpp includes <string> and <vector>
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
# wfb_tx allocates its FEC blocks once, at start (Coding conventions)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
CONFIG_MAIN_STACK_SIZE=8192
# The radar picture's drawing and JPEG encoding are floating point
CONFIG_FPU=y

# The SR250 radar on the shield. No SPI DMA: in Zephyr v4.4.2 it drops each transfer's first byte (src/uwb.c)
CONFIG_SPI=y
CONFIG_SPI_MCUX_FLEXCOMM_DMA=n
CONFIG_GPIO=y

# libsodium's random source: the TRNG
CONFIG_ENTROPY_GENERATOR=y

# NXP's WiFi driver, for monitor mode and sending frames from the host. No network is joined, so no
# supplicant; the driver still sits under Zephyr's networking.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_NXP_WIFI_NET_MONITOR=y
CONFIG_NXP_WIFI_HOST_TXRX_MGMT_FRAME=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=n
# The board's Ethernet isn't used
CONFIG_ETH_DRIVER=n

CONFIG_LOG=y
CONFIG_PRINTK=y
# printk straight to the console, not through the log buffer (which drops lines at boot)
CONFIG_LOG_PRINTK=n
